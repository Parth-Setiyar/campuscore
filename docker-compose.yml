version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: campuscore-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: campuscore
      MYSQL_USER: campuscore
      MYSQL_PASSWORD: campuscore_pass
    ports:
      - "3306:3306"
    volumes:
      - campuscore_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  campuscore_mysql_data:
